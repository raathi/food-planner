[package]
name = "food-planner"
version = "0.1.0"
edition = "2024"
description = "South Indian weekly food planner for a dev family, AI-integrated with GitHub Copilot"
authors = ["raathi"]
license = "MIT"

[dependencies]
clap = { version = "4", features = ["derive"] }
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1"
colored = "2"
dirs = "5"
toml = "0.8"

[dev-dependencies]
serde_json = "1"
